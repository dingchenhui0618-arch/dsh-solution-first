name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验 skill 与隐私
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 与本地 `python scripts/validate.py` 完全同一份逻辑
      - name: 运行 validate.py
        run: python scripts/validate.py
